{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6">

        <div class="card shadow">
            <div class="card-body">

                <h4 class="mb-3 text-center">
                    {{ 'Editar Producto' if producto else 'Nuevo Producto' }}
                </h4>

                <form method="post"
                      action="{{ '/actualizar/' + producto[0]|string if producto else '/guardar' }}">

                    <input type="text" name="nombre" placeholder="Nombre"
                           class="form-control mb-2"
                           value="{{ producto[1] if producto else '' }}" required>

                    <input type="text" name="categoria" placeholder="Categoría"
                           class="form-control mb-2"
                           value="{{ producto[2] if producto else '' }}" required>

                    <input type="number" step="0.01" name="precio" placeholder="Precio"
                           class="form-control mb-2"
                           value="{{ producto[3] if producto else '' }}" required>

                    <input type="number" name="stock" placeholder="Stock"
                           class="form-control mb-3"
                           value="{{ producto[4] if producto else '' }}" required>

                    <div class="d-grid">
                        <button class="btn btn-primary">Guardar</button>
                    </div>

                    <div class="text-center mt-2">
                        <a href="/">← Volver</a>
                    </div>

                </form>

            </div>
        </div>

    </div>
</div>

{% endblock %}
