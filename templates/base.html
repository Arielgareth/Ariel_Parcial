<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Inventario Pro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f4f6f9;
        }
        .sidebar {
            height: 100vh;
            background: #343a40;
            color: white;
            padding: 20px;
        }
        .sidebar h4 {
            color: #fff;
        }
        .sidebar a {
            color: #adb5bd;
            text-decoration: none;
            display: block;
            margin: 10px 0;
        }
        .sidebar a:hover {
            color: #fff;
        }
        .card {
            border-radius: 10px;
        }
    </style>
</head>

<body>

<div class="container-fluid">
    <div class="row">

        <!-- SIDEBAR -->
        <div class="col-md-2 sidebar">
            <h4>📦 Inventario</h4>
            <hr>
            <a href="/">🏠 Inicio</a>
            <a href="/nuevo">➕ Nuevo Producto</a>
        </div>

        <!-- CONTENIDO -->
        <div class="col-md-10 p-4">

            <!-- NAVBAR -->
            <div class="d-flex justify-content-between mb-4">
                <h3>Panel de Control</h3>
                <span class="badge bg-dark p-2">Sistema Activo</span>
            </div>

            {% block content %}{% endblock %}

        </div>

    </div>
</div>

</body>
</html>
